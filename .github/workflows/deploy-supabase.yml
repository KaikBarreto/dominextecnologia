name: Deploy Supabase (functions + migrations)

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'scripts/security/audit-rls.mjs'
      - 'scripts/security/audit-rls.test.mjs'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_ID: byqldosixshhuiuarszp
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  WEB_PUSH_VAPID_PUBLIC_KEY: ${{ secrets.WEB_PUSH_VAPID_PUBLIC_KEY }}
  WEB_PUSH_VAPID_PRIVATE_KEY: ${{ secrets.WEB_PUSH_VAPID_PRIVATE_KEY }}
  WEB_PUSH_VAPID_SUBJECT: ${{ secrets.WEB_PUSH_VAPID_SUBJECT }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Audit migration RLS guardrails
        run: |
          node --test scripts/security/audit-rls.test.mjs
          node scripts/security/audit-rls.mjs

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Push database migrations
        run: supabase db push --remote="$SUPABASE_PROJECT_ID" --include-all --yes
        continue-on-error: false

      - name: Configure Web Push secrets
        run: |
          test -n "$WEB_PUSH_VAPID_PUBLIC_KEY"
          test -n "$WEB_PUSH_VAPID_PRIVATE_KEY"
          test -n "$WEB_PUSH_VAPID_SUBJECT"
          supabase secrets set \
            VAPID_PUBLIC_KEY="$WEB_PUSH_VAPID_PUBLIC_KEY" \
            VAPID_PRIVATE_KEY="$WEB_PUSH_VAPID_PRIVATE_KEY" \
            VAPID_SUBJECT="$WEB_PUSH_VAPID_SUBJECT" \
            --remote="$SUPABASE_PROJECT_ID" \
            --yes

      - name: Deploy edge functions
        run: |
          for fn_dir in supabase/functions/*/; do
            fn_name=$(basename "$fn_dir")
            # pula a pasta _shared (helpers)
            if [ "$fn_name" = "_shared" ]; then continue; fi
            echo "→ Deploying function: $fn_name"
            supabase functions deploy "$fn_name" --remote="$SUPABASE_PROJECT_ID" --yes
          done

      - name: Remove retired fiscal edge functions
        run: |
          retired_functions=(
            fisqal-register-company
            fisqal-upload-certificate
            fisqal-check-coverage
            fisqal-emit-nfse
            fisqal-nfse-status
            fisqal-save-nfse-draft
            fisqal-delete-nfse-draft
            fisqal-cancel-nfse
            fisqal-webhook
            fisqal-tax-codes
            nfse-register-company
            nfse-webhook
          )

          deployed_json=$(supabase functions list --project-ref "$SUPABASE_PROJECT_ID" -o json)
          for fn_name in "${retired_functions[@]}"; do
            if jq -e --arg name "$fn_name" '.[] | select(.name == $name)' \
              <<<"$deployed_json" >/dev/null; then
              echo "→ Removing retired function: $fn_name"
              supabase functions delete "$fn_name" --project-ref "$SUPABASE_PROJECT_ID" --yes
            fi
          done

      - name: Remove retired fiscal secrets
        run: |
          retired_secrets=(
            FISQAL_API_KEY
            FISQAL_BASE_URL
            FISQAL_WEBHOOK_SECRET
            FISQAL_WEBHOOK_SIGNATURE_HEADER
          )

          existing_secrets=$(supabase secrets list --remote="$SUPABASE_PROJECT_ID" -o json)
          for secret_name in "${retired_secrets[@]}"; do
            if jq -e --arg name "$secret_name" \
              '.[] | select(.name == $name)' <<<"$existing_secrets" >/dev/null; then
              echo "→ Removing retired secret: $secret_name"
              supabase secrets unset "$secret_name" \
                --remote="$SUPABASE_PROJECT_ID" \
                --yes
            fi
          done
