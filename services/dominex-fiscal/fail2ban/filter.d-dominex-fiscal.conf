# /etc/fail2ban/filter.d/dominex-fiscal.conf
# ---------------------------------------------------------------------------
# Casa os 401 do bloco `fiscal.dominex.app` no log de acesso JSON do Caddy.
# É a resposta possível ao pedido de "allowlist de IP": a Supabase NÃO publica
# faixa estável de egresso das Edge Functions, então allowlist confiável não
# existe. O que dá pra fazer é: token forte + TLS + BANIR quem fica tentando.
#
# Pré-requisito no Caddyfile (já está no Caddyfile deste diretório):
#   - `format json { time_format rfc3339 }`
#   - NÃO usar `level ERROR` no bloco do fiscal (401 é logado em nível INFO;
#     com level ERROR o fail2ban nunca vê nada e a jail fica decorativa).
#
# Testar o filtro sem banir ninguém:
#   fail2ban-regex /var/log/caddy/fiscal.access.log /etc/fail2ban/filter.d/dominex-fiscal.conf
# ---------------------------------------------------------------------------
[Definition]
failregex = ^.*"remote_ip":"<HOST>".*"status":401.*$
ignoreregex =
datepattern = %%Y-%%m-%%dT%%H:%%M:%%S
