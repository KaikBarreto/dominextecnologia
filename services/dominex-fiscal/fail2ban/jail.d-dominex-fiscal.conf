# /etc/fail2ban/jail.d/dominex-fiscal.conf
# ---------------------------------------------------------------------------
# ⚠️ Arquivo NOVO em jail.d/ — NÃO edite o /etc/fail2ban/jail.local existente,
# que é onde vive a jail do SSH. Mexer lá arrisca o acesso à VPS.
#
# Política: 5 tentativas de token errado em 10 min = 1 hora de banimento.
# Uma edge function legítima NUNCA erra o token; se errar, é porque o segredo do
# Supabase e o arquivo da VPS estão fora de sincronia — e aí o certo é corrigir a
# rotação (RUNBOOK §3.2), não afrouxar a jail.
#
# ⚠️ maxretry baixo demais + rotação mal feita = você bane o egresso da Supabase
# e DERRUBA a emissão de nota de todo mundo. Por isso 5/10min e 1h (e não 3/1min
# e 1 dia). Se precisar desbanir com urgência:
#     sudo fail2ban-client set dominex-fiscal unbanip <IP>
# ---------------------------------------------------------------------------
[dominex-fiscal]
enabled  = true
filter   = dominex-fiscal
logpath  = /var/log/caddy/fiscal.access.log
port     = http,https
banaction = ufw
maxretry = 5
findtime = 10m
bantime  = 1h
