[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "domilink"
version = "0.1.0"
description = "Ponte local segura da Dominex para periféricos de PDV"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi==0.115.12",
  "pydantic==2.11.4",
  "tomli==2.2.1; python_version < '3.11'",
  "uvicorn==0.34.2",
]

[project.optional-dependencies]
serial = ["pyserial==3.5"]
escpos = ["python-escpos==3.1"]
dev = [
  "httpx==0.28.1",
  "mypy==1.15.0",
  "pytest==8.4.2",
  "pytest-asyncio==0.26.0",
  "ruff==0.11.10",
]
all = ["pyserial==3.5", "python-escpos==3.1"]

[project.scripts]
domilink = "domilink.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/domilink"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "RUF"]
ignore = [
  "S101", # asserts são esperados nos testes
  "S603", # subprocess usa lista fixa, sem shell, para o spooler local
  "S606", # os.startfile é o baseline de spooler no Windows
  "UP006", # estilo typing mantém o contrato legível no Python 3.9
  "UP007",
  "UP035",
]

[tool.mypy]
python_version = "3.9"
strict = true
packages = ["domilink"]
