# ajusta a assinatura ativa para "o cliente escolhe" (billingType UNDEFINED).
# Autentica DENTRO da função SÓ por header x-cron-secret == CRON_SECRET, fail-closed
# (sem secret configurado, ninguém entra). Não aceita JWT de tenant.
# verify_jwt=false porque a chamada manda o secret no x-cron-secret, não um JWT —
# com verify_jwt=true o gateway rejeitaria com 401 antes de a função avaliar o header.
[functions.admin-asaas-sync-billing]
verify_jwt = false

# sync-asaas-ledger: sincroniza o extrato Asaas (ledger) com o financeiro.
