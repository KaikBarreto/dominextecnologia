# porque o cron manda o segredo cru (não um JWT) — com verify_jwt=true o gateway rejeitava
# com 401 UNAUTHORIZED_INVALID_JWT_FORMAT antes de a função avaliar o x-cron-secret.
[functions.tenant-asaas-reconcile]
verify_jwt = false

