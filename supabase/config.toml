# à RPC submit_lead_capture_form (resolve tenant pelo short_code, valida, insere em
# customers, rate-limit por ip_hash). Anti-abuso (honeypot, cap de payload, hash
# SHA-256 do IP p/ LGPD) fica na própria função. verify_jwt=false porque não há JWT
# de usuário — só a apikey anon; a segurança é o short_code + rate-limit da RPC.
[functions.lead-capture-submit]
verify_jwt = false

